; Outdoor_Temp - HW-364B (ESP8266 + OLED)
; Temperature exterieure (sonde Zigbee via Zigbee2MQTT) affichee sur l'OLED

[platformio]
default_envs = hw364b

[env:hw364b]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags = -Wall

lib_deps =
    olikraus/U8g2@^2.35.30
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr --suppress=*:*/.pio/*
check_src_filters = +<src/main.cpp> +<lib/outdoor_logic/>

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
