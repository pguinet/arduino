; Claude_Dashboard - JC3248W535C
; Tableau de bord Claude Code (sessions distantes via MQTT/TLS)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include

lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr
check_src_filters = +<src/main.cpp> +<src/ui.cpp> +<src/beep.cpp> +<lib/dash_model/> +<lib/wifi_pick/>

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
